<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06111f">
  <title>Finley Labs</title>
  <meta name="description" content="Finley Labs is launching soon.">
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #06111f;
      --bg-soft: #0b1a31;
      --panel: rgba(9, 17, 33, 0.78);
      --text: #f4f7fb;
      --muted: #a9b4c7;
      --accent: #4aa3ff;
      --accent-2: #6a5cff;
      --border: rgba(255, 255, 255, 0.08);
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(74, 163, 255, 0.18), transparent 34%),
        radial-gradient(circle at bottom right, rgba(106, 92, 255, 0.18), transparent 28%),
        linear-gradient(180deg, #08111d 0%, #050a13 100%);
      overflow: hidden;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      position: relative;
    }

    .page::before,
    .page::after {
      content: "";
      position: absolute;
      inset: auto;
      border-radius: 999px;
      filter: blur(18px);
      pointer-events: none;
      opacity: 0.7;
    }

    .page::before {
      width: 28rem;
      height: 28rem;
      left: -10rem;
      top: -8rem;
      background: radial-gradient(circle, rgba(74, 163, 255, 0.18), transparent 70%);
    }

    .page::after {
      width: 22rem;
      height: 22rem;
      right: -8rem;
      bottom: -8rem;
      background: radial-gradient(circle, rgba(106, 92, 255, 0.18), transparent 70%);
    }

    .card {
      width: min(720px, 100%);
      padding: 36px 28px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(12, 22, 41, 0.88), rgba(7, 14, 27, 0.92));
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .brand img {
      width: 74px;
      height: 74px;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 16px 35px rgba(0, 0, 0, 0.4);
    }

    .brand-name {
      font-size: clamp(1.3rem, 2vw, 1.7rem);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 7vw, 5rem);
      line-height: 0.96;
      letter-spacing: -0.05em;
    }

    .subtext {
      margin: 18px auto 0;
      max-width: 36rem;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.65;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin: 32px auto 0;
    }

    .unit {
      padding: 18px 12px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .value {
      display: block;
      font-size: clamp(1.9rem, 5vw, 3rem);
      font-weight: 750;
      line-height: 1;
      color: #ffffff;
    }

    .label {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .launch-note {
      margin-top: 24px;
      color: rgba(244, 247, 251, 0.9);
      font-size: 0.98rem;
    }

    .launch-note strong {
      color: #ffffff;
    }

    @media (max-width: 640px) {
      .card {
        padding: 28px 18px;
        border-radius: 24px;
      }

      .brand {
        gap: 12px;
      }

      .brand img {
        width: 60px;
        height: 60px;
        border-radius: 16px;
      }

      .countdown {
        gap: 10px;
      }

      .unit {
        padding: 14px 8px;
        border-radius: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="headline">
      <div class="brand" aria-label="Finley Labs">
        <img src="logo.png" alt="Finley Labs logo">
        <div class="brand-name">Finley Labs</div>
      </div>

      <h1 id="headline">We’re launching in 30 days.</h1>
      <p class="subtext">A cleaner way to build, ship, and scale is on the way. Stay close while we count down to launch.</p>

      <div class="countdown" aria-label="Countdown timer">
        <div class="unit"><span class="value" id="days">30</span><span class="label">Days</span></div>
        <div class="unit"><span class="value" id="hours">00</span><span class="label">Hours</span></div>
        <div class="unit"><span class="value" id="minutes">00</span><span class="label">Minutes</span></div>
        <div class="unit"><span class="value" id="seconds">00</span><span class="label">Seconds</span></div>
      </div>

      <p class="launch-note">Launch date: <strong id="launch-date"></strong></p>
    </section>
  </main>

  <script>
    const launchDate = new Date();
    launchDate.setDate(launchDate.getDate() + 30);

    const launchDateLabel = document.getElementById('launch-date');
    launchDateLabel.textContent = launchDate.toLocaleDateString(undefined, {
      weekday: 'short',
      year: 'numeric',
      month: 'short',
      day: 'numeric'
    });

    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');

    function pad(value) {
      return String(value).padStart(2, '0');
    }

    function updateCountdown() {
      const now = new Date();
      const difference = Math.max(0, launchDate - now);

      const totalSeconds = Math.floor(difference / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      daysEl.textContent = String(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
